<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse Number</title>
</head>
<body>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  padding: 50px;
}

.container {
  background: white;
  padding: 30px;
  max-width: 400px;
  margin: 0 auto;
  border: 1px solid #ddd;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.input-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
}

input[type="number"] {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 10px;
  background-color: #333;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background-color: #555;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background-color: #f9f9f9;
  border: 1px solid #ddd;
  text-align: center;
  display: none;
}

.result.show {
  display: block;
}

.result strong {
  color: #333;
  font-size: 20px;
}
  </style>
  <div class="container">
    <h1>Reverse Number</h1>
    
    <div class="input-group">
      <label for="numberInput">Enter a Number:</label>
      <input type="number" id="numberInput" placeholder="Enter number">
    </div>

    <button onclick="showReverse()">Reverse Number</button>

    <div class="result" id="result"></div>
  </div>

  <script>
        function reverseNumber(num) {
      const reversed = parseInt(num.toString().split('').reverse().join(''));
      return reversed;
    }

    function showReverse() {
      const input = document.getElementById('numberInput').value;
      const result = document.getElementById('result');

      if (!input) {
        alert('Please enter a number!');
        return;
      }

      const reversed = reverseNumber(input);
      
      result.innerHTML = `
        Original Number: ${input}<br>
        Reversed Number: <strong>${reversed}</strong>
      `;
      result.classList.add('show');
    }
  </script>
</body>
</html>
