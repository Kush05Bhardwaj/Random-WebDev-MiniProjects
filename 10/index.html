<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anagram Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Anagram Checker</h1>
    
    <div class="input-group">
      <label for="string1">Enter First String:</label>
      <input type="text" id="string1" placeholder="e.g., listen">
    </div>

    <div class="input-group">
      <label for="string2">Enter Second String:</label>
      <input type="text" id="string2" placeholder="e.g., silent">
    </div>

    <button onclick="checkAnagram()">Check Anagram</button>

    <div class="result" id="result"></div>
  </div>

  <script src ="script.js"></script>
</body>
</html>
